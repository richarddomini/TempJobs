<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link rel="stylesheet" href="../estilo/elementos.css">
    <link rel="stylesheet" href="../estilo/mediaQueries.css">
</head>
<body>
    <div class="register-box">
        <picture class="pics">
                <img class="red-logo" src="../imagens/Opera_Instantâneo_2025-07-29_182133_www.figma.com-removebg-preview.png" alt="">
            </picture>
        <h2 class="title">
            Login
        </h2>
        
        <div class="input-box">
            <label class="label-text" for="email">Email:</label>
            <input class="standart-input" type="email" name="" id="email" placeholder="Insira seu Email">
        </div>
        <div class="input-box">
            <label class="label-text" for="password">Senha:</label>
            <input class="standart-input" type="password" name="" id="password" placeholder="Insira sua Senha">
        </div>
        <button class="button-3" type="submit">Login</button>
        <p class="reg-log">Não possui uma conta? <a href="">Clique aqui</a></p>
    </div>
</body>
</html>
