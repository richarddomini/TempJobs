<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link rel="stylesheet" href="../estilo/elementos.css">
    <link rel="stylesheet" href="../estilo/mediaQueries.css">
</head>
<body>
        <div class="register-box">
        <picture class="pics">
            <img class="red-logo" src="../imagens/Opera_Instantâneo_2025-07-29_182133_www.figma.com-removebg-preview.png" alt="">
        </picture>

        <div class="section-form">
            <h2 class="title">Dados Pessoais:</h2>

            <div class="forms">

                <div class="input-field">
                    <div class="input-box">
                        <label class="label-text" for="name">Nome:</label>
                        <input class="standart-input" type="text" name="" id="name" placeholder="Insira seu nome">
                    </div>
                    <div class="input-box">
                        <label class="label-text" for="brth-date">Data de Nascimento:</label>
                        <input class="standart-input" type="date" name="" id="brth-date" >
                    </div>
                    <div class="input-box">
                        <label class="label-text" for="email">Email:</label>
                        <input class="standart-input" type="email" name="" id="name" placeholder="Insira seu email">
                    </div>
                    <div class="input-box">
                        <label class="label-text" for="password">Senha:</label>
                        <input class="standart-input" type="text" name="" id="password" placeholder="Insira sua senha">
                    </div>
                </div>

                <div class="input-field">
                    
                    <div class="input-box">
                        <label class="label-text" for="profi">Profissão:</label>
                        <select name="" id="profi" class="standart-input"></select>
                    </div>

                    <div class="input-box">
                        <label class="label-text" for="mNeg">Modelo de negócio:</label>
                        <select name="" id="mNeg" class="standart-input"></select>
                    </div>

                    <div class="input-box">
                        <label class="label-text" for="cpfPj">CPF/CNPj:</label>
                        <input class="standart-input" type="number" name="" id="cpfPj" placeholder="Insira seu CPF">
                    </div>

                </div>

            </div>

            <h2 class="title">Endereço:</h2>

            <div class="forms">

                <div class="input-field">
                    
                    <div class="input-box">
                        <label class="label-text" for="cep">CEP:</label>
                        <input class="standart-input" type="number" name="" id="cep" placeholder="Insira seu CEP">
                    </div>

                    <div class="input-box">
                        <label class="label-text" for="logradouro">Logradouro:</label>
                        <input class="standart-input" type="text" name="" id="logradouro" >
                    </div>

                    <div class="input-box">
                        <label class="label-text" for="email">Bairro:</label>
                        <input class="standart-input" type="text" name="" id="bairro" placeholder="Insira seu Bairro">
                    </div>

                </div>

                <div class="input-field">
                    <div class="input-box">
                        <label class="label-text" for="complemento">Complemento:</label>
                        <input class="standart-input" type="text" name="" id="complemento" placeholder="Ex: bloco B, ao lado x">
                    </div>

                    <div class="input-box">
                        <label class="label-text" for="numero">Número:</label>
                        <input class="standart-input" type="text" name="" id="numero" placeholder="Insira o número da casa">
                    </div>
                </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
